tasks.register('verifyProductionKotlin') {
    group = 'verification'
    doLast {
        def sources = fileTree('src/main') { include '**/*.java' }.files
        if (!sources.empty) throw new GradleException("Production source must be Kotlin: ${sources}")
    }
}
tasks.named('check').configure { dependsOn tasks.named('verifyProductionKotlin') }
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doLast {
        def report = new File(workingDir, 'logs/latest.log')
        if (!report.isFile()) throw new GradleException('Missing native test report')
        def failures=report.readLines('UTF-8').findAll { it.contains('/ERROR]') && it.contains('LogTestReporter') && it.contains(' failed!') }
        if (!failures.empty) throw new GradleException("Required native test failure: ${failures.first()}")
    }
}

tasks.withType(Jar).configureEach { archiveBaseName = 'samcnpc-llm' }
