// JUnit uses named Minecraft classes; dependency JARs have already been reobfuscated by Forge.
tasks.withType(Test).configureEach {
    classpath = files(project(':samcnpc-core').sourceSets.main.output,
        project(':samcnpc-behavior').sourceSets.main.output) + classpath
