plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}

group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()

repositories {
    mavenCentral()
    maven {
        name = 'KotlinForForge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.add('-Xjvm-default=all')
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Published dependencies are pinned Git submodules and use the same dev remapping.
ext.fullVerificationId = null
evaluationDependsOn(':samcnpc-core')
evaluationDependsOn(':samcnpc-behavior')

def goalRestartId = providers.gradleProperty('llmGoalRestartId').orElse(rootProject.ext.fullVerificationId ?: 'manual').get()
if (!(goalRestartId ==~ /[A-Za-z0-9_-]{1,64}/)) throw new GradleException('Invalid llmGoalRestartId')
def goalRestartDirectory = "run-server-goals-restart-${goalRestartId}"
def plannerRestartDirectory = "run-server-planner-restart-${goalRestartId}"
def plannerDirectory = "run-server-planner-smoke-${goalRestartId}"
def supervisorDirectory = "run-server-supervisor-smoke-${goalRestartId}"
def supervisorFaultsDirectory = "run-server-supervisor-faults-${goalRestartId}"
def supervisorRestartDirectory = "run-server-supervisor-restart-${goalRestartId}"

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                // Match the working two-mod userdev path; production JARs use runtime names.
                samcnpc_core { source project(':samcnpc-core').sourceSets.main }
                samcnpc_behavior { source project(':samcnpc-behavior').sourceSets.main }
                samcnpc_llm {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
        clientLoadingSmoke {
            parent runs.client
            workingDirectory project.file('run-client-loading-smoke')
            property 'samcnpc.clientLoadingSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientPlannerSmoke {
            parent runs.client
            workingDirectory project.file('run-client-planner-smoke')
            property 'samcnpc.plannerClientSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverPlannerSmoke {
            parent runs.server
            workingDirectory project.file(plannerDirectory)
            property 'samcnpc.plannerServerSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientSupervisorSmoke {
            parent runs.client
            workingDirectory project.file('run-client-supervisor-smoke')
            property 'samcnpc.supervisorClientSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorSmoke {
            parent runs.server
            workingDirectory project.file(supervisorDirectory)
            property 'samcnpc.supervisorServerSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientSupervisorFaultsSmoke {
            parent runs.client
            workingDirectory project.file('run-client-supervisor-faults-smoke')
            property 'samcnpc.supervisorClientSmoke', 'true'
            property 'samcnpc.supervisorGroup', 'faults'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorFaultsSmoke {
            parent runs.server
            workingDirectory project.file(supervisorFaultsDirectory)
            property 'samcnpc.supervisorServerSmoke', 'true'
            property 'samcnpc.supervisorGroup', 'faults'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientGoalsSmoke {
            parent runs.client
            workingDirectory project.file('run-client-goals-smoke')
            property 'samcnpc.goalsClientSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorSaveSmoke {
            parent runs.server
            workingDirectory project.file(supervisorRestartDirectory)
            property 'samcnpc.supervisorRestartPhase', 'save'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorLoadSmoke {
            parent runs.server
            workingDirectory project.file(supervisorRestartDirectory)
            property 'samcnpc.supervisorRestartPhase', 'load'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverPlannerSaveSmoke {
            parent runs.server
            workingDirectory project.file(plannerRestartDirectory)
            property 'samcnpc.plannerRestartPhase', 'save'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverPlannerLoadSmoke {
            parent runs.server
            workingDirectory project.file(plannerRestartDirectory)
            property 'samcnpc.plannerRestartPhase', 'load'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverGoalsSaveSmoke {
            parent runs.server
            workingDirectory project.file(goalRestartDirectory)
            property 'samcnpc.goalRestartPhase', 'save'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverGoalsLoadSmoke {
            parent runs.server
            workingDirectory project.file(goalRestartDirectory)
            property 'samcnpc.goalRestartPhase', 'load'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverLiveModelSmoke {
            parent runs.server
            workingDirectory project.file('run-server-live-model-smoke')
            property 'samcnpc.liveModelSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverLoadingSmoke {
            parent runs.server
            workingDirectory project.file('run-server-loading-smoke')
            property 'samcnpc.serverLoadingSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':samcnpc-core')
    implementation project(':samcnpc-behavior')
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

// Real loading checks use test-only drivers and isolated run directories.
['Client', 'Server'].each { side ->
    tasks.matching { it.name == "run${side}LoadingSmoke" }.configureEach {
        def report = layout.projectDirectory.file("run-${side.toLowerCase()}-loading-smoke/${side.toLowerCase()}-loading-result.txt").asFile
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
        }
        doLast {
            if (!report.text.startsWith('PASS ')) throw new GradleException("Three-mod ${side} loading failed: ${report}")
        }
    }
}

// Command-line userdev needs the exact bundled Behavior data staged under its game directory.
['Run': 'run', 'ClientLoadingSmoke': 'run-client-loading-smoke', 'ServerLoadingSmoke': 'run-server-loading-smoke', 'ServerLiveModelSmoke': 'run-server-live-model-smoke', 'ClientGoalsSmoke': 'run-client-goals-smoke', 'ServerGoalsSaveSmoke': goalRestartDirectory, 'ServerGoalsLoadSmoke': goalRestartDirectory, 'ClientSupervisorSmoke': 'run-client-supervisor-smoke', 'ServerSupervisorSmoke': supervisorDirectory, 'ServerSupervisorSaveSmoke': supervisorRestartDirectory, 'ServerSupervisorLoadSmoke': supervisorRestartDirectory, 'ClientSupervisorFaultsSmoke': 'run-client-supervisor-faults-smoke', 'ServerSupervisorFaultsSmoke': supervisorFaultsDirectory, 'ClientPlannerSmoke': 'run-client-planner-smoke', 'ServerPlannerSmoke': plannerDirectory, 'ServerPlannerSaveSmoke': plannerRestartDirectory, 'ServerPlannerLoadSmoke': plannerRestartDirectory].each { suffix, folder ->
    def stage = tasks.register("stageBehaviorData${suffix}", Copy) {
        from project(':samcnpc-behavior').layout.projectDirectory.dir('src/main/resources/data')
        into layout.projectDirectory.dir("${folder}/data")
    }
    tasks.matching {
        suffix == 'Run' ? it.name in ['runClient', 'runServer'] : it.name == "run${suffix}"
    }.configureEach { dependsOn stage }
}


tasks.matching { it.name == 'runClientGoalsSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-client-goals-smoke/client-goals-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.text.startsWith('PASS ')) throw new GradleException("LLM goal client failed: ${report}")
    }
}


[[name: 'Goals', directory: goalRestartDirectory, report: 'goals'], [name: 'Supervisor', directory: supervisorRestartDirectory, report: 'supervisor'], [name: 'Planner', directory: plannerRestartDirectory, report: 'planner']].each { suite ->
['Save', 'Load'].each { stage ->
    tasks.matching { it.name == "runServer${suite.name}${stage}Smoke" }.configureEach {
        def report = layout.projectDirectory.file("${suite.directory}/server-${suite.report}-${stage.toLowerCase()}.txt").asFile
        doFirst {
            report.parentFile.mkdirs(); report.text = 'RUNNING\n'
            // Project-scoped EULA authorization: root AGENTS.md section 12.
            new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
            def settings = new File(report.parentFile, 'server.properties')
            if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=25575
online-mode=true
level-name=goal-restart-world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=0
generate-structures=false
difficulty=peaceful
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
"""
        }
        doLast {
            if (!report.text.startsWith('PASS ')) throw new GradleException("LLM goal restart ${stage} failed: ${report}")
        }
    }
}

}

tasks.matching { it.name == "runServerGoalsLoadSmoke" }.configureEach { mustRunAfter "runServerGoalsSaveSmoke" }
tasks.matching { it.name == "runServerSupervisorLoadSmoke" }.configureEach { mustRunAfter "runServerSupervisorSaveSmoke" }

// JUnit uses named Minecraft classes; dependency JARs have already been reobfuscated by Forge.
tasks.withType(Test).configureEach {
    classpath = files(project(':samcnpc-core').sourceSets.main.output,
        project(':samcnpc-behavior').sourceSets.main.output) + classpath
}


['Client', 'Server'].each { side ->
['', 'Faults'].each { campaign ->
    tasks.matching { it.name == "run"+side+"Supervisor"+campaign+"Smoke" }.configureEach {
        def folder = side == 'Server' ? (campaign ? supervisorFaultsDirectory : supervisorDirectory) :
            (campaign ? 'run-client-supervisor-faults-smoke' : 'run-client-supervisor-smoke')
        def report = layout.projectDirectory.file(folder+"/"+side.toLowerCase()+"-supervisor-result.txt").asFile
        doFirst {
            report.parentFile.mkdirs(); report.text = 'RUNNING\n'
            if (side == 'Server') {
                new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
                def settings = new File(report.parentFile, 'server.properties')
                if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=25576
online-mode=true
level-name=supervisor-world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=0
generate-structures=false
difficulty=peaceful
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
"""
            }
        }
        doLast { if (!report.text.startsWith('PASS ')) throw new GradleException("Supervisor "+side+" failed: "+report) }
    }
}

}

['Client', 'Server'].each { side ->
    tasks.matching { it.name == "run"+side+"PlannerSmoke" }.configureEach {
        def folder = side == 'Server' ? plannerDirectory : 'run-client-planner-smoke'
        def report = layout.projectDirectory.file(folder+"/"+side.toLowerCase()+"-planner-result.txt").asFile
        doFirst {
            report.parentFile.mkdirs(); report.text = 'RUNNING\n'
            if (side == 'Server') {
                new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
                def settings = new File(report.parentFile, 'server.properties')
                if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=25576
online-mode=true
level-name=planner-world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=0
generate-structures=false
difficulty=peaceful
view-distance=4
simulation-distance=4
max-players=1
spawn-protection=0
"""
            }
        }
        doLast { if (!report.text.startsWith('PASS ')) throw new GradleException("Planner "+side+" failed: "+report) }
    }
}

tasks.matching { it.name == "runServerPlannerLoadSmoke" }.configureEach { mustRunAfter "runServerPlannerSaveSmoke" }

def hourSourceHash = providers.gradleProperty('llmHourSourceHash').orElse('').get()
def hourRounds = providers.gradleProperty('llmHourRounds').orElse('24').get()
def hourRuns = [
    [name: 'serverLlmHourProbe', mode: 'PROBE', folder: "run-server-llm-hour-probe-${goalRestartId}"],
    [name: 'serverLlmHourBaseline', mode: 'BASELINE', folder: "run-server-llm-hour-baseline-${goalRestartId}"],
    [name: 'serverLlmHour', mode: 'FULL', folder: "run-server-llm-hour-${goalRestartId}"]
]
minecraft {
    runs {
        hourRuns.each { suite ->
            create(suite.name) {
                parent runs.server
                workingDirectory project.file(suite.folder)
                property 'samcnpc.llmHour', suite.mode
                property 'samcnpc.llmHourSourceHash', hourSourceHash
                property 'samcnpc.llmHourRounds', hourRounds
                mods { samcnpc_llm { source sourceSets.test } }
            }
        }
    }
}
hourRuns.each { suite ->
    def suffix = suite.name.substring(0, 1).toUpperCase() + suite.name.substring(1)
    def stage = tasks.register("stageBehaviorData${suffix}", Copy) {
        from project(':samcnpc-behavior').layout.projectDirectory.dir('src/main/resources/data')
        into layout.projectDirectory.dir(suite.folder + '/data')
    }
    tasks.matching { it.name == 'run' + suffix }.configureEach {
        dependsOn stage
        def report = layout.projectDirectory.file(suite.folder + '/llm-hour-result.txt').asFile
        doFirst {
            if (!(hourSourceHash ==~ /[0-9a-f]{64}/)) throw new GradleException('Supply llmHourSourceHash from the frozen manifest')
            report.parentFile.mkdirs(); report.text = 'RUNNING\n'
            new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
            def settings = new File(report.parentFile, 'server.properties')
            if (!settings.exists()) settings.text = """server-ip=127.0.0.1
server-port=25577
online-mode=true
level-name=llm-hour-world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=0
generate-structures=false
difficulty=normal
view-distance=8
simulation-distance=8
max-players=1
spawn-protection=0
"""
        }
        doLast { if (!report.text.startsWith('PASS ')) throw new GradleException('LLM hour failed: ' + report) }
    }
}

tasks.withType(Jar).configureEach {
    archiveBaseName = 'samcnpc-llm'
    manifest {
        attributes('Specification-Title': 'samcnpc-llm', 'Specification-Vendor': 'SAMCNPC',
            'Specification-Version': '1', 'Implementation-Title': 'samcnpc-llm',
            'Implementation-Version': project.version, 'Implementation-Vendor': 'SAMCNPC')
    }
}

// Requires an explicitly configured real endpoint; deliberately excluded from verifyAll.
tasks.matching { it.name == 'runServerLiveModelSmoke' }.configureEach {
    def report = layout.projectDirectory.file('run-server-live-model-smoke/live-model-result.txt').asFile
    doFirst { report.parentFile.mkdirs(); report.text = 'RUNNING\n' }
    doLast {
        if (!report.text.startsWith('PASS ')) throw new GradleException("Real model smoke failed: ${report}")
    }
}
