plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
}
group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()
repositories {
    mavenCentral()
    maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/'; content { includeGroup 'thedarkcolour' } }
}
java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17; freeCompilerArgs.add('-Xjvm-default=all') }
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
if (!rootProject.ext.has('fullVerificationId')) rootProject.ext.fullVerificationId = null
evaluationDependsOn(':samcnpc-core')
evaluationDependsOn(':samcnpc-behavior')

def goalRestartId = providers.gradleProperty('llmGoalRestartId').orElse(rootProject.ext.fullVerificationId ?: 'manual').get()
if (!(goalRestartId ==~ /[A-Za-z0-9_-]{1,64}/)) throw new GradleException('Invalid llmGoalRestartId')
def goalRestartDirectory = "run-server-goals-restart-${goalRestartId}"
def plannerRestartDirectory = "run-server-planner-restart-${goalRestartId}"
def missionRestartDirectory = "run-server-mission-restart-${goalRestartId}"
def plannerDirectory = "run-server-planner-smoke-${goalRestartId}"
def supervisorDirectory = "run-server-supervisor-smoke-${goalRestartId}"
def supervisorFaultsDirectory = "run-server-supervisor-faults-${goalRestartId}"
def supervisorRestartDirectory = "run-server-supervisor-restart-${goalRestartId}"
def corpusCaptureDirectory = "run-server-corpus-capture-${goalRestartId}"
def showtimeDirectory = "run-server-showtime-smoke-${goalRestartId}"
def loadingDirectory = "run-server-loading-smoke-${goalRestartId}"

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                // Match the working two-mod userdev path; production JARs use runtime names.
                samcnpc_core { source project(':samcnpc-core').sourceSets.main }
                samcnpc_behavior { source project(':samcnpc-behavior').sourceSets.main }
                samcnpc_llm {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
        clientLoadingSmoke {
            parent runs.client
            workingDirectory project.file('run-client-loading-smoke')
            property 'samcnpc.clientLoadingSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientPlannerSmoke {
            parent runs.client
            workingDirectory project.file('run-client-planner-smoke')
            property 'samcnpc.plannerClientSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverPlannerSmoke {
            parent runs.server
            workingDirectory project.file(plannerDirectory)
            property 'samcnpc.plannerServerSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientSupervisorSmoke {
            parent runs.client
            workingDirectory project.file('run-client-supervisor-smoke')
            property 'samcnpc.supervisorClientSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorSmoke {
            parent runs.server
            workingDirectory project.file(supervisorDirectory)
            property 'samcnpc.supervisorServerSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientSupervisorFaultsSmoke {
            parent runs.client
            workingDirectory project.file('run-client-supervisor-faults-smoke')
            property 'samcnpc.supervisorClientSmoke', 'true'
            property 'samcnpc.supervisorGroup', 'faults'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorFaultsSmoke {
            parent runs.server
            workingDirectory project.file(supervisorFaultsDirectory)
            property 'samcnpc.supervisorServerSmoke', 'true'
            property 'samcnpc.supervisorGroup', 'faults'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        clientGoalsSmoke {
            parent runs.client
            workingDirectory project.file('run-client-goals-smoke')
            property 'samcnpc.goalsClientSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorSaveSmoke {
            parent runs.server
            workingDirectory project.file(supervisorRestartDirectory)
            property 'samcnpc.supervisorRestartPhase', 'save'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverSupervisorLoadSmoke {
            parent runs.server
            workingDirectory project.file(supervisorRestartDirectory)
            property 'samcnpc.supervisorRestartPhase', 'load'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverPlannerSaveSmoke {
            parent runs.server
            workingDirectory project.file(plannerRestartDirectory)
            property 'samcnpc.plannerRestartPhase', 'save'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverPlannerLoadSmoke {
            parent runs.server
            workingDirectory project.file(plannerRestartDirectory)
            property 'samcnpc.plannerRestartPhase', 'load'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverMissionSaveSmoke {
            parent runs.server
            workingDirectory project.file(missionRestartDirectory)
            property 'samcnpc.missionRestartPhase', 'save'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverMissionLoadSmoke {
            parent runs.server
            workingDirectory project.file(missionRestartDirectory)
            property 'samcnpc.missionRestartPhase', 'load'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverGoalsSaveSmoke {
            parent runs.server
            workingDirectory project.file(goalRestartDirectory)
            property 'samcnpc.goalRestartPhase', 'save'
            property 'samcnpc.expressionSmoke', providers.gradleProperty('llmExpressionSmoke').orElse('false').get()
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverGoalsLoadSmoke {
            parent runs.server
            workingDirectory project.file(goalRestartDirectory)
            property 'samcnpc.goalRestartPhase', 'load'
            property 'samcnpc.expressionSmoke', providers.gradleProperty('llmExpressionSmoke').orElse('false').get()
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverLiveModelSmoke {
            parent runs.server
            workingDirectory project.file('run-server-live-model-smoke')
            property 'samcnpc.liveModelSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverShowtimeSmoke {
            parent runs.server
            workingDirectory project.file(showtimeDirectory)
            property 'samcnpc.showtimeSmoke', 'true'
            property 'samcnpc.fieldSmoke', providers.gradleProperty('llmFieldSmoke').orElse('false').get()
            property 'samcnpc.sequenceSmoke', providers.gradleProperty('llmSequenceSmoke').orElse('false').get()
            property 'samcnpc.missionV2Smoke', providers.gradleProperty('llmMissionV2Smoke').orElse('false').get()
            property 'samcnpc.missionScriptedSmoke', providers.gradleProperty('llmMissionScriptedSmoke').orElse('false').get()
            property 'samcnpc.boundedFieldSmoke', providers.gradleProperty('llmBoundedFieldSmoke').orElse('false').get()
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverCorpusCapture {
            parent runs.server
            workingDirectory project.file(corpusCaptureDirectory)
            property 'samcnpc.corpusCapture', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
        serverLoadingSmoke {
            parent runs.server
            workingDirectory project.file(loadingDirectory)
            property 'samcnpc.serverLoadingSmoke', 'true'
            mods { samcnpc_llm { source sourceSets.test } }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation project(':samcnpc-core')
    implementation project(':samcnpc-behavior')
    implementation "thedarkcolour:kotlinforforge:${kotlin_for_forge_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('processResources', ProcessResources).configure {
    def identitySources = files(fileTree('src/main'), file('build.gradle'), rootProject.file('build.gradle'), rootProject.file('gradle.properties')).files
    def fingerprint = java.security.MessageDigest.getInstance('SHA-256')
    identitySources.sort { rootProject.relativePath(it).replace('\\', '/') }.each { source ->
        fingerprint.update(rootProject.relativePath(source).replace('\\', '/').getBytes('UTF-8'))
        fingerprint.update((byte) 0)
        fingerprint.update(source.bytes)
        fingerprint.update((byte) 0)
    }
    def buildId = fingerprint.digest().encodeHex().toString()
    inputs.property 'buildId', buildId
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, buildId: buildId
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

// Real loading checks use test-only drivers and isolated run directories.
['Client', 'Server'].each { side ->
    tasks.matching { it.name == "run${side}LoadingSmoke" }.configureEach {
        def folder = side == 'Server' ? loadingDirectory : 'run-client-loading-smoke'
        def report = layout.projectDirectory.file("${folder}/${side.toLowerCase()}-loading-result.txt").asFile
        doFirst {
            report.parentFile.mkdirs()
            report.text = 'RUNNING\n'
            if (side == 'Server') {
                new File(report.parentFile, 'eula.txt').text = 'eula=true\n'
                def settings = new File(report.parentFile, 'server.properties')
                if (!settings.exists()) settings.text = '''server-ip=127.0.0.1
server-port=25574
online-mode=true
level-name=loading-smoke-world
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
level-seed=0
generate-structures=false
difficulty=peaceful
view-distance=4
simulation-distance=4
spawn-protection=0
'''
            }
        }
        doLast {
            if (!report.text.startsWith('PASS ')) throw new GradleException("Three-mod ${side} loading failed: ${report}")
        }
    }
}

// Command-line userdev needs the exact bundled Behavior data staged under its game directory.
def stageShowtimeData = tasks.register('stageBehaviorDataServerShowtimeSmoke', Copy) {
    from project(':samcnpc-behavior').layout.projectDirectory.dir('src/main/resources/data')
    into layout.projectDirectory.dir("${showtimeDirectory}/data")
}
tasks.matching { it.name == 'runServerShowtimeSmoke' }.configureEach {
    dependsOn stageShowtimeData
    doFirst {
        def directory = layout.projectDirectory.dir(showtimeDirectory).asFile
        directory.mkdirs()
        new File(directory, 'eula.txt').text = 'eula=true\n'
        new File(directory, 'showtime-result.txt').text = 'RUNNING\n'
        if (!new File(directory, 'server.properties').exists()) {
            new File(directory, 'server.properties').text = '''server-ip=127.0.0.1
server-port=25578
online-mode=true
level-name=showtime-regression-world
level-type=minecraft:flat
level-seed=0
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}
generate-structures=false
difficulty=peaceful
view-distance=4
simulation-distance=4
spawn-protection=0
'''
        }
    }
    doLast {
        def report = layout.projectDirectory.file("${showtimeDirectory}/showtime-result.txt").asFile
        if (!report.text.startsWith('PASS ')) throw new GradleException("Real Qwen showtime regression failed: ${report}")
    }
}
['Run': 'run', 'ClientLoadingSmoke': 'run-client-loading-smoke', 'ServerLoadingSmoke': loadingDirectory, 'ServerLiveModelSmoke': 'run-server-live-model-smoke', 'ServerCorpusCapture': corpusCaptureDirectory, 'ClientGoalsSmoke': 'run-client-goals-smoke', 'ServerGoalsSaveSmoke': goalRestartDirectory, 'ServerGoalsLoadSmoke': goalRestartDirectory, 'ClientSupervisorSmoke': 'run-client-supervisor-smoke', 'ServerSupervisorSmoke': supervisorDirectory, 'ServerSupervisorSaveSmoke': supervisorRestartDirectory, 'ServerSupervisorLoadSmoke': supervisorRestartDirectory, 'ClientSupervisorFaultsSmoke': 'run-client-supervisor-faults-smoke', 'ServerSupervisorFaultsSmoke': supervisorFaultsDirectory, 'ClientPlannerSmoke': 'run-client-planner-smoke', 'ServerPlannerSmoke': plannerDirectory, 'ServerPlannerSaveSmoke': plannerRestartDirectory, 'ServerPlannerLoadSmoke': plannerRestartDirectory].each { suffix, folder ->
    def stage = tasks.register("stageBehaviorData${suffix}", Copy) {
        from project(':samcnpc-behavior').layout.projectDirectory.dir('src/main/resources/data')
        into layout.projectDirectory.dir("${folder}/data")
    }
    tasks.matching {
        suffix == 'Run' ? it.name in ['runClient', 'runServer'] : it.name == "run${suffix}"
    }.configureEach { dependsOn stage }
}


