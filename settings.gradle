pluginManagement {
    repositories { gradlePluginPortal(); maven { url = 'https://maven.minecraftforge.net/' } }
}
rootProject.name = 'samcnpc-llm'
def coreDirectory = file(providers.gradleProperty('samcnpcCoreDir').getOrElse('../samcnpc-core'))
if (!new File(coreDirectory, 'build.gradle').isFile()) throw new GradleException('Provide the sibling core source directory with -PsamcnpcCoreDir=<path>, or build from the umbrella checkout.')
include 'samcnpc-core'
project(':samcnpc-core').projectDir = coreDirectory
def behaviorDirectory = file(providers.gradleProperty('samcnpcBehaviorDir').getOrElse('../samcnpc-behavior'))
if (!new File(behaviorDirectory, 'build.gradle').isFile()) throw new GradleException('Provide the sibling behavior source directory with -PsamcnpcBehaviorDir=<path>, or build from the umbrella checkout.')
include 'samcnpc-behavior'
project(':samcnpc-behavior').projectDir = behaviorDirectory
